<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#6d28d9"/>
<animate attributeName="x2" values="1;.6;1" dur="10s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="r"><rect width="960" height="220" rx="16"/></clipPath>
<style>
.name{fill:#fff;font-size:46px;font-weight:700;letter-spacing:1px;opacity:0;animation:in .9s ease-out .2s forwards}
.sub{fill:#dbeafe;font-size:20px;opacity:0}
.s1{animation:cycle 9s ease-in-out 1.1s infinite}
.s2{animation:cycle 9s ease-in-out 4.1s infinite}
.s3{animation:cycle 9s ease-in-out 7.1s infinite}
.dot{fill:#fff;opacity:.0;animation:float 6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cycle{0%{opacity:0;transform:translateY(6px)}8%,30%{opacity:1;transform:none}38%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes float{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.5;transform:translateY(-14px)}}
</style>
</defs>
<g clip-path="url(#r)">
<rect width="960" height="220" fill="url(#bg)"/>
<circle class="dot" cx="120" cy="70" r="3"/><circle class="dot" cx="300" cy="40" r="2" style="animation-delay:1.5s"/>
<circle class="dot" cx="700" cy="55" r="3" style="animation-delay:3s"/><circle class="dot" cx="860" cy="90" r="2" style="animation-delay:4.5s"/>
<text class="name" x="480.0" y="98" text-anchor="middle">Gustavo Carvalho</text>
<text class="sub s1" x="480.0" y="135" text-anchor="middle">Desenvolvedor Fullstack</text>
<text class="sub s2" x="480.0" y="135" text-anchor="middle">Java · Python · Spring Boot · FastAPI</text>
<text class="sub s3" x="480.0" y="135" text-anchor="middle">Estudante de Engenharia de Software</text>
<path d="M0 168 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 V220 H0 Z" fill="#fff" fill-opacity=".10"><animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="7s" repeatCount="indefinite"/></path>
<path d="M0 182 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 q60.0 -18 120.0 0 t120.0 0 V220 H0 Z" fill="#fff" fill-opacity=".14"><animateTransform attributeName="transform" type="translate" from="-240 0" to="0 0" dur="10s" repeatCount="indefinite"/></path>
<path d="M0 198 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 V220 H0 Z" fill="#fff" fill-opacity=".20"><animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="5s" repeatCount="indefinite"/></path>
</g>
</svg>