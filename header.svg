<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--name:#1f2328;--sub:#59636e;--accent:#0969da}
@media (prefers-color-scheme:dark){:root{--name:#f0f6fc;--sub:#9198a1;--accent:#58a6ff}}
.name{fill:var(--name);font-size:40px;font-weight:700;opacity:0;animation:in .8s ease-out .2s forwards}
.sub{fill:var(--sub);font-size:19px;opacity:0}
.line{fill:var(--accent);width:0;animation:grow .9s ease-out .6s forwards}
.s1{animation:cycle 9s ease-in-out 1.2s infinite}
.s2{animation:cycle 9s ease-in-out 4.2s infinite}
.s3{animation:cycle 9s ease-in-out 7.2s infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:64px}}
@keyframes cycle{0%{opacity:0;transform:translateY(6px)}8%,30%{opacity:1;transform:none}38%,100%{opacity:0;transform:translateY(-6px)}}
</style>
<text class="name" x="430" y="62" text-anchor="middle">Gustavo Carvalho</text>
<rect class="line" x="398" y="78" height="3" rx="1.5"/>
<text class="sub s1" x="430" y="118" text-anchor="middle">Desenvolvedor Fullstack</text>
<text class="sub s2" x="430" y="118" text-anchor="middle">Python · Java · Spring Boot · FastAPI</text>
<text class="sub s3" x="430" y="118" text-anchor="middle">Engenharia de Software</text>
</svg>
