<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Gradientes sutis para as ondas em tons de azul puro -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0033aa" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002266" />
      <stop offset="50%" stop-color="#0044cc" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001433" />
      <stop offset="50%" stop-color="#002b80" />
      <stop offset="100%" stop-color="#0055d4" />
    </linearGradient>

    <!-- Máscara para manter cantos arredondados -->
    <clipPath id="roundedClip">
      <rect width="850" height="200" rx="16" ry="16" />
    </clipPath>

    <style>
      /* Animação horizontal infinita das ondas */
      @keyframes moveWaveHorizontal {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-850px);
        }
      }

      .wave-layer-1 {
        animation: moveWaveHorizontal 10s linear infinite;
      }

      .wave-layer-2 {
        animation: moveWaveHorizontal 15s linear infinite reverse;
      }

      .wave-layer-3 {
        animation: moveWaveHorizontal 20s linear infinite;
      }
    </style>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Fundo Preto Minimalista -->
    <rect width="850" height="200" fill="#000000" />

    <!-- Camada 3: Onda do fundo (mais alta e sutil) -->
    <g class="wave-layer-3" opacity="0.35">
      <path fill="url(#waveGrad3)" d="
        M 0 145 
        Q 212.5 130, 425 145 T 850 145 
        Q 1062.5 130, 1275 145 T 1700 145 
        L 1700 200 L 0 200 Z" />
    </g>

    <!-- Camada 2: Onda intermediária -->
    <g class="wave-layer-2" opacity="0.6">
      <path fill="url(#waveGrad2)" d="
        M 0 160 
        Q 212.5 142, 425 160 T 850 160 
        Q 1062.5 142, 1275 160 T 1700 160 
        L 1700 200 L 0 200 Z" />
    </g>

    <!-- Camada 1: Onda frontal (mais viva e definida) -->
    <g class="wave-layer-1" opacity="0.95">
      <path fill="url(#waveGrad1)" d="
        M 0 172 
        Q 212.5 158, 425 172 T 850 172 
        Q 1062.5 158, 1275 172 T 1700 172 
        L 1700 200 L 0 200 Z" />
    </g>
  </g>
</svg>
